services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pilot-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: pilot-web/Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000
    container_name: pilot-frontend
    ports:
      - "4173:80"
    depends_on:
      - backend
    restart: unless-stopped
