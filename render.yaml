services:
  - type: web
    name: pilotapp
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pilot-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://pilotapp.onrender.com"]'

databases:
  - name: pilot-db
    databaseName: pilot
    user: pilot