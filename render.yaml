services:
  - type: web
    name: pilotapp
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_AUTO_INIT
        value: "false"
      - key: AI_MOCK_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: pilot-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://pilotapp.onrender.com","https://highwaypilotai.com","https://www.highwaypilotai.com"]'

databases:
  - name: pilot-db
    databaseName: pilot
    user: pilot