services:
  - type: web
    name: pilotapp
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ai/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DB_AUTO_INIT
        value: "false"
      - key: AI_MOCK_MODE
        value: "false"
      - key: AI_MODEL_PRIMARY
        value: openai
      - key: AI_MODEL_FALLBACK
        value: anthropic
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ANTHROPIC_MODEL
        value: claude-3-5-sonnet-latest
      - key: RATE_LIMIT_BACKEND
        value: auto
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "120"
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_STARTER
        sync: false
      - key: STRIPE_PRICE_ID_PROFESSIONAL
        sync: false
      - key: STRIPE_PRICE_ID_ENTERPRISE
        sync: false
      - key: BILLING_MOCK_MODE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pilot-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: pilot-db
    databaseName: pilot
    user: pilot