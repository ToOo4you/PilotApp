name: Quick Check

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  quick-check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pilot-web/package-lock.json

      - name: Create venv
        shell: pwsh
        run: python -m venv .venv

      - name: Install backend runtime deps
        shell: pwsh
        run: .\.venv\Scripts\python -m pip install --upgrade pip; .\.venv\Scripts\python -m pip install fastapi uvicorn sqlalchemy pydantic

      - name: Install frontend deps
        working-directory: pilot-web
        shell: pwsh
        run: npm ci

      - name: Run quick check
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\QUICK_CHECK.ps1
